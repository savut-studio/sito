<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="vôs">
  <!-- Icona di vôs (variante D, scelta il 31 ottobre 2026): tre tracce di montaggio e la testina, con il circonflesso
       di vôs al posto del pallino. Verde acqua #4CC2B3, il colore di vôs; niente rosso (resta a suns, "registra"). -->
  <rect width="256" height="256" rx="57.6" fill="#1C1C1C"/>
  <rect x="40" y="76" width="92" height="24" rx="12" fill="#4CC2B3"/>
  <rect x="148" y="76" width="68" height="24" rx="12" fill="#737373"/>
  <rect x="40" y="124" width="48" height="24" rx="12" fill="#737373"/>
  <rect x="104" y="124" width="112" height="24" rx="12" fill="#4CC2B3"/>
  <rect x="40" y="172" width="80" height="24" rx="12" fill="#4CC2B3"/>
  <rect x="136" y="64" width="8" height="152" rx="4" fill="#F2F2F2"/>
  <g transform="translate(140 30)" fill="#F2F2F2">
    <rect x="-6" y="-6" width="34" height="12" rx="6" transform="rotate(45)"/>
    <rect x="-6" y="-6" width="34" height="12" rx="6" transform="rotate(135)"/>
  </g>
</svg>
