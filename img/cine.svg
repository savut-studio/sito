       da regia, con il play. Ambra #F5C04A, il colore di cine; niente rosso (resta a suns, "registra"). -->
  <rect width="256" height="256" rx="57.6" fill="#1C1C1C"/>
  <rect x="40" y="52" width="120" height="24" rx="12" fill="#737373"/>
  <rect x="40" y="92" width="160" height="24" rx="12" fill="#737373"/>
  <rect x="40" y="140" width="176" height="68" rx="34" fill="#F5C04A"/>
  <polygon points="118,162 118,186 140,174" fill="#1C1C1C" stroke="#1C1C1C" stroke-width="8" stroke-linejoin="round"/>
</svg>
